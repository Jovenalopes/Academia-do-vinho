body { font-family: 'Inter', sans-serif; }
h1,h2,h3,h4,h5,h6 { font-family: 'Cormorant Garamond', serif; }
.wine-gradient { background: linear-gradient(135deg, #771f37 0%, #420c1a 100%); }
.gold-gradient { background: linear-gradient(135deg, #c7a230 0%, #ab7f26 100%); }
.card-hover { transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }

.nav-item.active { background: rgba(199,162,48,0.15); border-left: 3px solid #c7a230; }

.map-path { transition: all 0.3s; cursor: pointer; }

.glass { background: rgba(255,255,255,0.75); backdrop-filter: blur(12px); }
.dark .glass { background: rgba(30,27,24,0.85); }
.quiz-option { transition: all 0.2s; cursor: pointer; }
.quiz-option:hover { background: rgba(199,162,48,0.1); }
.quiz-option.correct { background: rgba(34,197,94,0.2); border-color: #22c55e; }
.quiz-option.wrong { background: rgba(239,68,68,0.2); border-color: #ef4444; }
.progress-bar { transition: width 0.6s ease-out; }
@media(max-width:768px){ .mobile-pb { padding-bottom: 80px; } }
.region { transition: all 0.3s; cursor: default; }
.region:hover { opacity: 0.85; }
.region-label { font-size: 8px; fill: #fff; font-weight: bold; text-shadow: 0 0 4px rgba(0,0,0,0.8); pointer-events: none; }
.legend-text { font-size: 7px; fill: #333; }
.dark .legend-text { fill: #ccc; }
.country-flag { font-size: 2.25rem; line-height: 1; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.2s; }
.country-flag:hover { transform: scale(1.05); }
.country-card { transition: all 0.2s; }
.country-card:hover { background-color: #fdf2f4; border-color: #c93055; }
.dark .country-card:hover { background-color: #2d1b24; border-color: #c93055; }

function saveState(){ LS.set('xp',state.xp); LS.set('notes',state.notes); LS.set('tastings',state.tastings); LS.set('favorites',state.favorites); LS.set('videos',state.videos); LS.set('studypages',state.studyPages); LS.set('progress',state.progress); }

function go(page, params){
    if(!params) params={};
    state.page=page; state.params=params;
    updateNav(); render(); window.scrollTo(0,0);
}

function updateNav(){
    document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.toggle('active', el.dataset.page===state.page); });
    document.querySelectorAll('[data-mobile]').forEach(function(el){
        var active = el.dataset.mobile===state.page;
        el.className = 'flex flex-col items-center gap-1 p-2 ' + (active ? 'text-wine-600 dark:text-wine-400' : 'text-gray-400 dark:text-gray-600');
    });
    var xpEl = document.getElementById('xpDisplay');
    if(xpEl) xpEl.textContent = state.xp.toLocaleString() + ' XP';
}

function toggleDark(){
    document.documentElement.classList.toggle('dark');
    LS.set('dark',document.documentElement.classList.contains('dark'));
}
if(LS.get('dark')) document.documentElement.classList.add('dark');

function doSearch(q){
    q = q.toLowerCase().trim();
    if(!q) return;
    var results = [];
    DB.countries.forEach(function(c){
        if(c.name.toLowerCase().indexOf(q)>-1 || c.wines.some(function(w){return w.toLowerCase().indexOf(q)>-1;}))
            results.push({type:'País',name:c.name+' '+c.flag,page:'country',id:c.id});
    });
    DB.grapes.forEach(function(g){
        if(g.name.toLowerCase().indexOf(q)>-1)
            results.push({type:'Uva',name:g.name,page:'grape',id:g.id});
    });
    state.notes.forEach(function(n){
        if(n.title.toLowerCase().indexOf(q)>-1 || n.text.toLowerCase().indexOf(q)>-1)
            results.push({type:'Anotação',name:n.title,page:'notebook'});
    });
    go('search',{query:q,results:results});
}

function render(){
    var m = document.getElementById('mainContent');
    switch(state.page){
        case 'home': renderHome(m); break;
        case 'map': renderMap(m); break;
        case 'country': renderCountry(m,state.params); break;
        case 'grapes': renderGrapes(m); break;
        case 'grape': renderGrape(m,state.params); break;
        case 'wines': renderWines(m); break;
        case 'courses': renderCourses(m); break;
        case 'videos': renderVideos(m); break;
        case 'notebook': renderNotebook(m); break;
        case 'tasting': renderTasting(m); break;
        case 'pairing': renderPairing(m); break;
        case 'quiz': renderQuiz(m); break;
        case 'progress': renderProgress(m); break;
        case 'editor': renderEditor(m); break;
        case 'search': renderSearch(m,state.params); break;
        default: renderHome(m);
    }
}

function addVideo(){
    var input = document.getElementById('ytInput');
    var url = input.value.trim();
    if(!url) return;
    var match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
    if(!match){ alert('Link inválido. Use um link do YouTube válido.'); return; }
    var id = match[1];
    state.videos.unshift({id:id,title:'Vídeo do YouTube',desc:'Adicionado pelo usuário',country:'',grape:'',tags:['estudo'],done:false});
    saveState(); render();
}

function toggleVidDone(id){
    var v = state.videos.find(function(x){ return x.id === id; });
    if(v){ v.done = !v.done; if(v.done) state.xp += 50; saveState(); render(); }
}

function addNote(){
    var title = prompt('Título da anotação:'); if(!title) return;
    var text = prompt('Conteúdo:'); if(text === null) return;
    state.notes.unshift({title:title,text:text,date:new Date().toLocaleDateString('pt-BR'),country:'',grape:''});
    state.xp += 25; saveState(); render();
}

function editNote(i){
    var n = state.notes[i];
    var t = prompt('Editar título:',n.title); if(t === null) return;
    var tx = prompt('Editar conteúdo:',n.text); if(tx === null) return;
    n.title = t; n.text = tx; saveState(); render();
}

function delNote(i){
    if(confirm('Excluir esta nota?')){ state.notes.splice(i,1); saveState(); render(); }
}

function selectTasting(btn){
    var parent = btn.parentElement;
    parent.querySelectorAll('button').forEach(function(b){ b.classList.remove('bg-wine-600','text-white'); b.classList.add('border-wine-200'); });
    btn.classList.add('bg-wine-600','text-white'); btn.classList.remove('border-wine-200');
}

function toggleTasting(btn){
    btn.classList.toggle('bg-wine-100'); btn.classList.toggle('border-wine-400'); btn.classList.toggle('text-wine-700');
}

function setTastingStar(n){
    document.querySelectorAll('.tasting-star').forEach(function(s,i){
        s.classList.toggle('text-gold-400', i < n);
        s.classList.toggle('text-gray-300', i >= n);
    });
}

function saveTasting(){
    alert('Ficha de degustação salva! +100 XP'); state.xp += 100; state.tastings.push({date:new Date().toLocaleDateString('pt-BR')});
    saveState(); go('progress');
}

function renderQuiz(el){

        html += '<div class="text-6xl mb-4">🏆</div>';

        html += '<div class="bg-white dark:bg-gray-900 rounded-2xl p-6 border border-wine-100 dark:border-gray-800 mb-6">';
        html += '<p class="text-sm text-gray-500 mb-1">Pontuação ganha</p>';
        html += '<p class="text-3xl font-bold text-gold-600 font-serif;">+'+(state.quizScore * 100)+' XP</p></div>';
        html += '<button onclick="state.quizIndex=0; state.quizScore=0; render();" class="px-6 py-3 bg-wine-700 hover:bg-wine-800 text-white rounded-xl font-medium">Refazer Quiz</button>';
        html += '</div>';
        el.innerHTML = html;
        return;
    }
    var q = DB.quizzes[state.quizIndex];
    var html = '<div class="fade-in p-4 md:p-8 max-w-2xl mx-auto">';
    html += '<div class="flex items-center justify-between mb-6">';
    html += '<h1 class="text-2xl font-bold text-wine-900 dark:text-wine-200 font-serif">Quiz</h1>';
    html += '<span class="text-sm text-gray-500">'+(state.quizIndex+1)+' / '+DB.quizzes.length+'</span></div>';
    html += '<div class="bg-white dark:bg-gray-900 rounded-2xl p-6 border border-wine-100 dark:border-gray-800 shadow-sm mb-4">';
    html += '<p class="text-lg font-medium text-wine-900 dark:text-wine-200 mb-6">'+q.q+'</p>';
    html += '<div class="space-y-3" id="quizOptions">';
    q.opts.forEach(function(opt,i){
        html += '<button onclick="answerQuiz('+i+')" class="quiz-option w-full p-4 text-left border border-wine-200 dark:border-gray-700 rounded-xl hover:border-wine-400 dark:hover:border-wine-600 transition-all" data-idx="'+i+'">';
        html += '<span class="font-semibold mr-2">'+String.fromCharCode(65+i)+'.</span>'+opt+'</button>';
    });
    html += '</div>';
    html += '<div id="quizFeedback" class="hidden mt-4 p-4 rounded-xl"></div>';
    html += '</div>';
    html += '<div class="w-full bg-wine-100 dark:bg-wine-950 rounded-full h-2"><div class="bg-wine-600 h-2 rounded-full progress-bar" style="width:'+((state.quizIndex/DB.quizzes.length)*100)+'%"></div></div>';
    html += '</div>';
    el.innerHTML = html;
}

function answerQuiz(idx){
    var q = DB.quizzes[state.quizIndex];
    var opts = document.querySelectorAll('.quiz-option');
    opts.forEach(function(o,i){
        o.disabled = true;
        o.classList.add(i===q.correct?'correct':'wrong');
        o.classList.remove('hover:bg-wine-50');
    });
    var fb = document.getElementById('quizFeedback');
    fb.classList.remove('hidden');
    if(idx === q.correct){
        fb.className = 'mt-4 p-4 rounded-xl bg-green-50 dark:bg-green-950/30 border border-green-200 dark:border-green-900 text-green-800 dark:text-green-400';
        fb.innerHTML = '<strong>✅ Correto!</strong><p class="text-sm mt-1">'+q.exp+'</p>';
        state.quizScore++; state.xp += 100;
    } else {
        fb.className = 'mt-4 p-4 rounded-xl bg-red-50 dark:bg-red-950/30 border border-red-200 dark:border-red-900 text-red-800 dark:text-red-400';
        fb.innerHTML = '<strong>❌ Errado!</strong><p class="text-sm mt-1">'+q.exp+'</p>';
    }
    setTimeout(function(){ state.quizIndex++; saveState(); render(); }, 2500);
}

    html += '<div class="grid grid-cols-2 md:grid-cols-3 gap-3">';
    achievements.forEach(function(a){
        html += '<div class="'+(a.got?'bg-white dark:bg-gray-900':'bg-gray-100 dark:bg-gray-800 opacity-60')+' rounded-2xl p-4 border '+(a.got?'border-wine-100 dark:border-gray-800':'border-transparent')+' text-center">';
        html += '<div class="text-3xl mb-2">'+a.icon+'</div>';
        html += '<p class="font-semibold text-sm text-wine-900 dark:text-wine-200">'+a.name+'</p>';
        html += '<p class="text-xs text-gray-500">'+a.desc+'</p></div>';
    });
    html += '</div></div>';
    el.innerHTML = html;
}

function renderEditor(el){
    var html = '<div class="fade-in p-4 md:p-8 max-w-5xl mx-auto">';
    html += '<h1 class="text-3xl md:text-4xl font-bold text-wine-900 dark:text-wine-200 font-serif mb-2">Editor de Estudos</h1>';
    html += '<p class="text-gray-600 dark:text-gray-400 mb-6">Crie suas próprias páginas de estudo.</p>';
    html += '<div class="bg-white dark:bg-gray-900 rounded-2xl border border-wine-100 dark:border-gray-800 shadow-sm overflow-hidden">';
    html += '<div class="p-4 border-b border-wine-100 dark:border-gray-800 flex flex-wrap gap-2">';
    html += '<button onclick="addEditorBlock(\'text\')" class="px-3 py-1.5 text-xs rounded-lg border border-wine-200 hover:bg-wine-50 dark:border-gray-700 dark:hover:bg-wine-950/20 transition-colors">📝 Texto</button>';
    html += '<button onclick="addEditorBlock(\'youtube\')" class="px-3 py-1.5 text-xs rounded-lg border border-wine-200 hover:bg-wine-50 dark:border-gray-700 dark:hover:bg-wine-950/20 transition-colors">🎥 YouTube</button>';
    html += '<button onclick="addEditorBlock(\'image\')" class="px-3 py-1.5 text-xs rounded-lg border border-wine-200 hover:bg-wine-50 dark:border-gray-700 dark:hover:bg-wine-950/20 transition-colors">🖼️ Imagem</button>';
    html += '<button onclick="addEditorBlock(\'table\')" class="px-3 py-1.5 text-xs rounded-lg border border-wine-200 hover:bg-wine-50 dark:border-gray-700 dark:hover:bg-wine-950/20 transition-colors">📊 Tabela</button>';
    html += '<button onclick="addEditorBlock(\'quote\')" class="px-3 py-1.5 text-xs rounded-lg border border-wine-200 hover:bg-wine-50 dark:border-gray-700 dark:hover:bg-wine-950/20 transition-colors">💡 Curiosidade</button>';
    html += '</div>';
    html += '<div id="editorCanvas" class="p-6 min-h-[400px] space-y-4">';
    html += '<input type="text" placeholder="Título da página..." class="w-full text-2xl font-serif font-bold bg-transparent border-none outline-none text-wine-900 dark:text-wine-200 placeholder-gray-300">';
    html += '<input type="text" placeholder="Subtítulo..." class="w-full text-sm bg-transparent border-none outline-none text-gray-500 placeholder-gray-300">';
    html += '</div>';
    html += '<div class="p-4 border-t border-wine-100 dark:border-gray-800 bg-wine-50 dark:bg-wine-950/20">';
    html += '<button onclick="saveStudyPage()" class="px-5 py-2 bg-wine-700 hover:bg-wine-800 text-white rounded-xl text-sm font-medium"><i class="fas fa-save mr-2"></i>Salvar Página</button>';
    html += '</div></div>';
    if(state.studyPages.length > 0){
        html += '<div class="mt-6"><h3 class="font-bold text-wine-900 dark:text-wine-200 font-serif mb-3">Páginas Salvas</h3><div class="space-y-2">';
        state.studyPages.forEach(function(sp,i){
            html += '<div class="bg-white dark:bg-gray-900 rounded-xl p-4 border border-wine-100 dark:border-gray-800 flex items-center justify-between">';
            html += '<span class="font-medium text-sm">'+(sp.title||'Sem título')+'</span>';
            html += '<button onclick="alert(\'Página carregada (simulação)\')" class="text-wine-600 text-sm"><i class="fas fa-eye mr-1"></i>Ver</button></div>';
        });
        html += '</div></div>';
    }
    html += '</div>';
    el.innerHTML = html;
}

function addEditorBlock(type){
    var canvas = document.getElementById('editorCanvas');
    if(!canvas) return;
    if(type === 'text'){
        canvas.insertAdjacentHTML('beforeend','<div class="p-3 bg-wine-50 dark:bg-wine-950/20 rounded-xl"><textarea placeholder="Digite seu texto..." class="w-full bg-transparent text-sm outline-none resize-none h-20 text-gray-700 dark:text-gray-300"></textarea></div>');
    }
    if(type === 'youtube'){
        var id = prompt('Cole o ID ou link do YouTube:');
        if(id){
            var vid = id.match(/([a-zA-Z0-9_-]{11})/);
            vid = vid ? vid[1] : id;
            canvas.insertAdjacentHTML('beforeend','<div class="aspect-video bg-gray-900 rounded-xl overflow-hidden"><iframe class="w-full h-full" src="https://www.youtube.com/embed/'+vid+'" frameborder="0" allowfullscreen></iframe></div>');
        }
    }
    if(type === 'image'){
        canvas.insertAdjacentHTML('beforeend','<div class="p-4 border-2 border-dashed border-wine-200 dark:border-gray-700 rounded-xl text-center text-sm text-gray-400">[Área para imagem — em produção, adicione URL]</div>');
    }
    if(type === 'table'){
        canvas.insertAdjacentHTML('beforeend','<div class="overflow-x-auto"><table class="w-full text-sm"><tr class="bg-wine-50 dark:bg-wine-950/30"><th class="p-2 text-left">Característica</th><th class="p-2 text-left">Valor</th></tr><tr><td class="p-2 border-b border-wine-100 dark:border-gray-800">Uva</td><td class="p-2 border-b border-wine-100 dark:border-gray-800">Cabernet Sauvignon</td></tr></table></div>');
    }
    if(type === 'quote'){
        canvas.insertAdjacentHTML('beforeend','<div class="p-4 bg-gold-50 dark:bg-gold-950/20 border-l-4 border-gold-400 rounded-r-xl"><p class="text-sm italic text-gold-800 dark:text-gold-400">&quot;O vinho é a poesia da terra.&quot;</p></div>');
    }
}

function saveStudyPage(){
    state.studyPages.push({title:'Nova Página de Estudo',date:new Date().toLocaleDateString('pt-BR')});
    state.xp += 75; saveState();
    alert('Página salva! +75 XP'); render();
}

function renderSearch(el, params){
    var html = '<div class="fade-in p-4 md:p-8 max-w-4xl mx-auto">';
    html += '<h1 class="text-2xl font-bold text-wine-900 dark:text-wine-200 font-serif mb-2">Resultados para &quot;'+params.query+'&quot;</h1>';
    html += '<p class="text-gray-500 text-sm mb-6">'+params.results.length+' resultados encontrados</p>';
    html += '<div class="space-y-3">';
    if(params.results.length === 0){
        html += '<p class="text-gray-400">Nenhum resultado encontrado.</p>';
    } else {
        params.results.forEach(function(r){
            html += '<button onclick="go(\''+r.page+'\',{id:\''+(r.id||'')+'\'})" class="w-full text-left bg-white dark:bg-gray-900 rounded-xl p-4 border border-wine-100 dark:border-gray-800 hover:border-wine-300 transition-colors">';
            html += '<span class="text-xs text-gold-600 font-semibold uppercase tracking-wider">'+r.type+'</span>';
            html += '<p class="font-semibold text-wine-900 dark:text-wine-200 mt-1">'+r.name+'</p></button>';
        });
    }
    html += '</div></div>';
    el.innerHTML = html;
}

function addFav(type,id){
    state.favorites.push({type:type,id:id,date:new Date().toLocaleDateString('pt-BR')});
    saveState(); alert('Adicionado aos favoritos!');
}

// Init
document.addEventListener('DOMContentLoaded',function(){
    updateNav(); render();
});
</script>
</body>
</html>
