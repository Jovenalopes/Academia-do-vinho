<style>
body { font-family: 'Inter', sans-serif; }
h1,h2,h3,h4,h5,h6 { font-family: 'Cormorant Garamond', serif; }
.wine-gradient { background: linear-gradient(135deg, #771f37 0%, #420c1a 100%); }
.gold-gradient { background: linear-gradient(135deg, #c7a230 0%, #ab7f26 100%); }
.card-hover { transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
.card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -10px rgba(66,12,26,0.15); }
.nav-item { transition: all 0.2s; }
.nav-item.active { background: rgba(199,162,48,0.15); border-left: 3px solid #c7a230; }
.fade-in { animation: fadeIn 0.4s ease-out; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.map-path { transition: all 0.3s; cursor: pointer; }
.map-path:hover { fill: #a82343; filter: drop-shadow(0 0 8px rgba(168,35,67,0.4)); }
.glass { background: rgba(255,255,255,0.75); backdrop-filter: blur(12px); }
.dark .glass { background: rgba(30,27,24,0.85); }
.quiz-option { transition: all 0.2s; cursor: pointer; }
.quiz-option:hover { background: rgba(199,162,48,0.1); }
.quiz-option.correct { background: rgba(34,197,94,0.2); border-color: #22c55e; }
.quiz-option.wrong { background: rgba(239,68,68,0.2); border-color: #ef4444; }
.progress-bar { transition: width 0.6s ease-out; }
@media(max-width:768px){ .mobile-pb { padding-bottom: 80px; } }
.region { transition: all 0.3s; cursor: default; }
.region:hover { opacity: 0.85; }
.region-label { font-size: 8px; fill: #fff; font-weight: bold; text-shadow: 0 0 4px rgba(0,0,0,0.8); pointer-events: none; }
.legend-text { font-size: 7px; fill: #333; }
.dark .legend-text { fill: #ccc; }
/* Estilo para as bandeiras na lista */
.country-flag { font-size: 2.25rem; line-height: 1; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.2s; }
.country-flag:hover { transform: scale(1.05); }
.country-card { transition: all 0.2s; }
.country-card:hover { background-color: #fdf2f4; border-color: #c93055; }
.dark .country-card:hover { background-color: #2d1b24; border-color: #c93055; }
</style>

function saveState(){ LS.set('xp',state.xp); LS.set('notes',state.notes); LS.set('tastings',state.tastings); LS.set('favorites',state.favorites); LS.set('videos',state.videos); LS.set('studypages',state.studyPages); LS.set('progress',state.progress); }

function go(page, params){
    if(!params) params={};
    state.page=page; state.params=params;
    updateNav(); render(); window.scrollTo(0,0);
}

function updateNav(){
    document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.toggle('active', el.dataset.page===state.page); });
    document.querySelectorAll('[data-mobile]').forEach(function(el){
        var active = el.dataset.mobile===state.page;
        el.className = 'flex flex-col items-center gap-1 p-2 ' + (active ? 'text-wine-600 dark:text-wine-400' : 'text-gray-400 dark:text-gray-600');
    });
    var xpEl = document.getElementById('xpDisplay');
    if(xpEl) xpEl.textContent = state.xp.toLocaleString() + ' XP';
}

function toggleDark(){
    document.documentElement.classList.toggle('dark');
    LS.set('dark',document.documentElement.classList.contains('dark'));
}
if(LS.get('dark')) document.documentElement.classList.add('dark');

function doSearch(q){
    q = q.toLowerCase().trim();
    if(!q) return;
    var results = [];
    DB.countries.forEach(function(c){
        if(c.name.toLowerCase().indexOf(q)>-1 || c.wines.some(function(w){return w.toLowerCase().indexOf(q)>-1;}))
            results.push({type:'País',name:c.name+' '+c.flag,page:'country',id:c.id});
    });
    DB.grapes.forEach(function(g){
        if(g.name.toLowerCase().indexOf(q)>-1)
            results.push({type:'Uva',name:g.name,page:'grape',id:g.id});
    });
    state.notes.forEach(function(n){
        if(n.title.toLowerCase().indexOf(q)>-1 || n.text.toLowerCase().indexOf(q)>-1)
            results.push({type:'Anotação',name:n.title,page:'notebook'});
    });
    go('search',{query:q,results:results});
}

function render(){
    var m = document.getElementById('mainContent');
    switch(state.page){
        case 'home': renderHome(m); break;
        case 'map': renderMap(m); break;
        case 'country': renderCountry(m,state.params); break;
        case 'grapes': renderGrapes(m); break;
        case 'grape': renderGrape(m,state.params); break;
        case 'wines': renderWines(m); break;
        case 'courses': renderCourses(m); break;
        case 'videos': renderVideos(m); break;
        case 'notebook': renderNotebook(m); break;
        case 'tasting': renderTasting(m); break;
        case 'pairing': renderPairing(m); break;
        case 'quiz': renderQuiz(m); break;
        case 'progress': renderProgress(m); break;
        case 'editor': renderEditor(m); break;
        case 'search': renderSearch(m,state.params); break;
        default: renderHome(m);
    }
}

function renderCountry(el, params){
    var c = DB.countries.find(function(x){ return x.id === params.id; });
    if(!c) return go('map');
    var html = '<div class="fade-in">';
    html += '<div class="relative h-56 md:h-72 wine-gradient overflow-hidden">';
    html += '<div class="absolute inset-0 opacity-20" style="background-image:radial-gradient(circle,white 1px,transparent 0);background-size:25px 25px;"></div>';
    html += '<div class="absolute inset-0 flex items-center justify-center">';
    html += '<div class="text-center text-white p-8">';
    html += '<div class="text-6xl mb-3">'+c.flag+'</div>';
    html += '<h1 class="text-4xl md:text-5xl font-bold font-serif mb-2">'+c.name+'</h1>';
    html += '<p class="text-wine-100 max-w-xl mx-auto">'+c.desc+'</p>';
    html += '</div></div></div>';
    
    html += '<div class="p-4 md:p-8 max-w-6xl mx-auto -mt-8 relative z-10">';
    html += '<div class="grid md:grid-cols-3 gap-4 mb-8">';
    var infoCards = [['🌡️ Clima',c.climate],['🪨 Solo',c.soil],['📜 História',c.history]];
    infoCards.forEach(function(ic){
        html += '<div class="bg-white dark:bg-gray-900 rounded-2xl p-5 border border-wine-100 dark:border-gray-800 shadow-sm">';
        html += '<div class="text-xl mb-2">'+ic[0]+'</div>';
        html += '<p class="text-sm text-gray-600 dark:text-gray-400">'+ic[1]+'</p></div>';
    });
    html += '</div>';
    
    html += '<div class="grid md:grid-cols-2 gap-8 mb-8">';
    html += '<div class="bg-white dark:bg-gray-900 rounded-2xl p-6 border border-wine-100 dark:border-gray-800">';
    html += '<h3 class="text-xl font-bold text-wine-900 dark:text-wine-200 font-serif mb-4">🍇 Principais Uvas</h3>';
    html += '<div class="flex flex-wrap gap-2">';
    c.grapes.forEach(function(g){
        var gid = DB.grapes.find(function(x){ return x.name === g; });
        gid = gid ? gid.id : '';
        html += '<button onclick="go(\'grape\',{id:\''+gid+'\'})" class="px-3 py-1.5 bg-wine-50 dark:bg-wine-950/30 text-wine-700 dark:text-wine-300 rounded-full text-sm border border-wine-200 dark:border-wine-800 hover:bg-wine-100 transition-colors">'+g+'</button>';
    });
    html += '</div></div>';
    
    // ================== MAPA DAS REGIÕES (para todos os países com mapa definido) ==================
    var mapData = countryMaps[c.id];
    if(mapData) {
        html += '<div class="bg-white dark:bg-gray-900 rounded-2xl p-6 border border-wine-100 dark:border-gray-800">';
        html += '<h3 class="text-xl font-bold text-wine-900 dark:text-wine-200 font-serif mb-4">🗺️ Mapa das Regiões Vinícolas</h3>';
        html += '<div class="w-full">';
        html += '<svg viewBox="0 0 400 500" class="w-full h-auto border border-wine-200 dark:border-gray-700 rounded-xl bg-[#f0f4f8] dark:bg-gray-800">';
        html += '<path d="'+mapData.outline+'" fill="none" stroke="#2d3748" stroke-width="2" class="dark:stroke-gray-400"/>';
        var colors = ['#f6ad55','#fc8181','#68d391','#63b3ed','#9f7aea','#f687b3','#f6ad55','#fc8181','#68d391','#63b3ed','#9f7aea','#f687b3'];
        mapData.regions.forEach(function(r, idx){
            var color = r.color || colors[idx % colors.length];
            html += '<polygon points="'+r.path+'" fill="'+color+'" opacity="0.8" stroke="#2d3748" stroke-width="1.5" class="region" />';
            var pts = r.path.split(' ').map(function(p){ return p.split(',').map(Number); });
            var cx = pts.reduce(function(a,b){ return a + b[0]; },0)/pts.length;
            var cy = pts.reduce(function(a,b){ return a + b[1]; },0)/pts.length;
            html += '<text x="'+cx+'" y="'+cy+'" class="region-label" text-anchor="middle" dominant-baseline="central">'+r.name+'</text>';
        });
        var legHeight = mapData.regions.length * 8 + 10;
        html += '<rect x="10" y="'+(500-legHeight-10)+'" width="120" height="'+legHeight+'" rx="8" fill="white" opacity="0.9" class="dark:fill-gray-900" />';
        mapData.regions.forEach(function(r, idx){
            var color = r.color || colors[idx % colors.length];
            var y = (500-legHeight+10) + idx * 8;
            html += '<rect x="16" y="'+y+'" width="10" height="6" fill="'+color+'" rx="2" />';
            html += '<text x="32" y="'+(y+5)+'" class="legend-text">'+r.name+'</text>';
        });
        html += '</svg>';
        html += '<p class="text-xs text-gray-400 mt-2 text-center">Mapa ilustrativo das principais regiões</p>';
        html += '</div></div>';
    } else {
        html += '<div class="bg-white dark:bg-gray-900 rounded-2xl p-6 border border-wine-100 dark:border-gray-800">';
        html += '<h3 class="text-xl font-bold text-wine-900 dark:text-wine-200 font-serif mb-4">🍷 Regiões Principais</h3>';
        html += '<div class="space-y-2">';
        c.wines.forEach(function(w){
            html += '<div class="flex items-center gap-3 p-2 rounded-lg hover:bg-wine-50 dark:hover:bg-wine-950/20 transition-colors"><i class="fas fa-map-marker-alt text-wine-400"></i><span class="text-sm font-medium text-wine-800 dark:text-wine-300">'+w+'</span></div>';
        });
        html += '</div></div>';
    }
    html += '</div>';
    
    html += '<div class="bg-white dark:bg-gray-900 rounded-2xl p-6 border border-wine-100 dark:border-gray-800 mb-8">';
    html += '<h3 class="text-xl font-bold text-wine-900 dark:text-wine-200 font-serif mb-4">⭐ Vinhos Famosos</h3>';
    html += '<div class="grid grid-cols-1 md:grid-cols-3 gap-3">';
    c.famous.forEach(function(f){
        html += '<div class="p-4 bg-wine-50 dark:bg-wine-950/20 rounded-xl border border-wine-100 dark:border-wine-900"><p class="font-semibold text-wine-800 dark:text-wine-300 text-sm">'+f+'</p></div>';
    });
    html += '</div></div>';
    
    html += '<div class="grid md:grid-cols-2 gap-6 mb-8">';
    html += '<div class="bg-white dark:bg-gray-900 rounded-2xl p-6 border border-wine-100 dark:border-gray-800">';
    html += '<h3 class="text-xl font-bold text-wine-900 dark:text-wine-200 font-serif mb-3">🌡️ Temperatura de Serviço</h3>';
    html += '<p class="text-sm text-gray-600 dark:text-gray-400">'+c.temp+'</p></div>';
    html += '<div class="bg-white dark:bg-gray-900 rounded-2xl p-6 border border-wine-100 dark:border-gray-800">';
    html += '<h3 class="text-xl font-bold text-wine-900 dark:text-wine-200 font-serif mb-3">🍷 Taças Recomendadas</h3>';
    html += '<p class="text-sm text-gray-600 dark:text-gray-400">'+c.glass+'</p></div>';
    html += '</div>';
    
    html += '<div class="flex gap-3">';
    html += '<button onclick="go(\'map\')" class="px-5 py-2.5 border border-wine-300 dark:border-wine-700 text-wine-700 dark:text-wine-300 rounded-xl text-sm hover:bg-wine-50 dark:hover:bg-wine-950/30 transition-colors"><i class="fas fa-arrow-left mr-2"></i>Voltar ao Mapa</button>';
    html += '<button onclick="go(\'grapes\')" class="px-5 py-2.5 bg-wine-700 hover:bg-wine-800 text-white rounded-xl text-sm transition-colors">Explorar Uvas<i class="fas fa-arrow-right ml-2"></i></button>';
    html += '</div></div></div>';
    el.innerHTML = html;
}
